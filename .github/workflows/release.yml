---
name: Release
permissions: {}

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux SDL build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev fcitx-libs-dev

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: >
          cmake --build build --config Release
          --target dmxc
          --target dmx-lang-visualizer

      - name: Configure CMake (Debug, validation only)
        run: >
          cmake -B build-debug
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF

      - name: Build (Debug, validation only)
        run: >
          cmake --build build-debug --config Debug
          --target dmxc
          --target dmx-lang-visualizer

      - name: Stage binaries
        shell: bash
        run: |
          set -e
          mkdir dist
          # CMAKE_RUNTIME_OUTPUT_DIRECTORY puts binaries in build/Release
          # for both multi-config (MSVC) and single-config (Make/Ninja with
          # CMAKE_BUILD_TYPE set) generators.
          cp build/Release/dmxc* dist/
          cp build/Release/dmx-lang-visualizer* dist/

      - name: Stage binaries (Debug)
        shell: bash
        run: |
          set -e
          mkdir dist-debug
          cp build-debug/Debug/dmxc* dist-debug/
          cp build-debug/Debug/dmx-lang-visualizer* dist-debug/

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath dmx-lang-${{ matrix.platform }}.zip
          Compress-Archive -Path dist-debug/* -DestinationPath debug-dmx-lang-${{ matrix.platform }}.zip

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -e
          (cd dist && zip -r ../dmx-lang-${{ matrix.platform }}.zip .)
          (cd dist-debug && zip -r ../debug-dmx-lang-${{ matrix.platform }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: dmx-lang-${{ matrix.platform }}
          path: dmx-lang-${{ matrix.platform }}.zip
          if-no-files-found: error

      - name: Upload artifacts (Debug, validation only, not attached to releases)
        uses: actions/upload-artifact@v4
        with:
          name: debug-dmx-lang-${{ matrix.platform }}
          path: debug-dmx-lang-${{ matrix.platform }}.zip
          if-no-files-found: error

  build-web:
    name: Build web (Emscripten, validation only)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14

      - name: Configure CMake (Emscripten)
        run: >
          emcmake cmake -B build-web
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >
          cmake --build build-web --config Release
          --target dmx-lang-visualizer-web

      - name: Stage web build
        shell: bash
        run: |
          set -e
          mkdir dist-web
          cp build-web/Release/dmx-lang-visualizer-web.html dist-web/
          cp build-web/Release/dmx-lang-visualizer-web.js dist-web/
          cp build-web/Release/dmx-lang-visualizer-web.wasm dist-web/

      - name: Package
        shell: bash
        run: |
          set -e
          (cd dist-web && zip -r ../web-dmx-lang.zip .)

      - name: Upload artifact (web, validation only, not attached to releases)
        uses: actions/upload-artifact@v4
        with:
          name: web-dmx-lang
          path: web-dmx-lang.zip
          if-no-files-found: error

  release-tag:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dmx-lang-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip

  release-latest:
    name: Update rolling "latest" release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Move the "latest" tag to this commit
        run: |
          git tag -f latest
          git push origin -f latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dmx-lang-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (auto-updated)
          prerelease: true
          make_latest: false
          files: artifacts/*.zip
